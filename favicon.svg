  <rect x="27" y="26" width="10" height="28" rx="2" fill="url(#bar2)"/>
  <rect x="42" y="14" width="10" height="40" rx="2" fill="url(#bar3)"/>
  
  <!-- Trend arrow pointing up-right -->
  <path d="M 10 48 L 24 34 L 32 40 L 52 22" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
